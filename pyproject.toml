[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ord-bench"
version = "0.1.0"
description = "ORD-Bench: An adversarially constructed benchmark for enterprise resource selection"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.50,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]
dev = ["pytest>=8", "black", "ruff"]
